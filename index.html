<!doctype html>
<html lang="en" data-theme="braun">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#e9e4dc" />
  <meta name="description" content="Bouncy Calculator — a fast, offline, deeply interactive calculator with 14 themes, tools and games." />
  <title>Bouncy Calculator</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <script>
    // Apply the saved theme before first paint (no flash).
    try {
      var t = JSON.parse(localStorage.getItem('bouncy.v5.theme'));
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dot' : 'braun';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="bg-art" aria-hidden="true"></div>
  <div class="fx-overlay" aria-hidden="true"></div>

  <div class="shell">
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-name">Bouncy</span>
          <span class="brand-label" id="themeLabel"></span>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="btnHistory" aria-label="History" title="History (H)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></svg>
          </button>
          <button class="icon-btn" id="btnTheme" aria-label="Themes" title="Themes (T)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.2-4-7.6-9-7.6Z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7.2" r="1.2"/><circle cx="15" cy="7.6" r="1.2"/></svg>
          </button>
          <button class="icon-btn" id="btnMenu" aria-label="Commands" title="Commands (Ctrl+K)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
          </button>
        </div>
      </header>

      <nav class="tabs" role="tablist" aria-label="Mode">
        <button role="tab" data-view="calc" aria-selected="true">Calc</button>
        <button role="tab" data-view="tools" aria-selected="false">Tools</button>
        <button role="tab" data-view="games" aria-selected="false">Games</button>
        <span class="tab-ink" aria-hidden="true"></span>
      </nav>

      <main class="stage">
        <section class="view view-calc is-active" data-view="calc" aria-label="Calculator">
          <div class="display" id="display">
            <div class="lcd-ghost" aria-hidden="true">88888888888</div>
            <div class="display-meta">
              <button class="chip" id="angleChip" title="Toggle degrees / radians (D)">DEG</button>
              <span class="chip chip-mem" id="memChip" hidden>M</span>
              <span class="meta-hint" id="metaHint">swipe ← delete · ↓ clear · ↑ history</span>
            </div>
            <div class="expr" id="expr" role="textbox" aria-label="Expression" aria-readonly="true" tabindex="-1"></div>
            <button class="result" id="result" aria-live="polite" title="Tap to copy"></button>
          </div>
        </section>

        <section class="view view-tools" data-view="tools" aria-label="Tools" id="tools"></section>
        <section class="view view-games" data-view="games" aria-label="Games" id="games"></section>
      </main>

      <div class="pad-wrap" id="padWrap">
        <div class="sci" id="sci" aria-label="Scientific functions"></div>
        <div class="mem-row" id="memRow"></div>
        <div class="keypad" id="keypad" aria-label="Keypad"></div>
      </div>
    </div>

    <aside class="side" id="historyPanel" aria-label="History">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="side-head">
        <h2>Tape</h2>
        <button class="text-btn" id="historyClear">Clear</button>
        <button class="icon-btn only-mobile" id="historyClose" aria-label="Close history">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <input class="search" id="historySearch" type="search" placeholder="Search tape…" aria-label="Search history" />
      <ol class="tape" id="tape"></ol>
      <p class="tape-empty" id="tapeEmpty">Your calculations print here, like a receipt roll.<br />Tap one to reuse it.</p>
    </aside>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <dialog class="sheet theme-sheet" id="themeSheet" aria-label="Choose a theme">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="side-head">
      <h2>Themes</h2>
      <button class="text-btn" id="themeShuffle">Shuffle</button>
      <button class="icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="theme-grid" id="themeGrid"></div>
    <div class="settings" id="settings"></div>
  </dialog>

  <dialog class="palette" id="palette" aria-label="Command palette">
    <input id="paletteInput" placeholder="Type a command or a sum…" autocomplete="off" spellcheck="false" />
    <ul id="paletteList" role="listbox"></ul>
    <div class="palette-foot">↑↓ choose · Enter run · Esc close</div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
